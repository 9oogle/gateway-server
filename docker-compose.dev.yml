# dev: 단일 인스턴스 (application.yaml 의 local 프로필 사용)
services:
  gateway-server:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    container_name: goggles-gateway-server
    restart: unless-stopped
    ports:
      - "9003:9003"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "9003"
      EUREKA_SERVER_URL1: goggles-eureka-server
      EUREKA_SERVER_URL2: goggles-eureka-server
      KEYCLOAK_URL: http://keycloak:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9003/actuator/health 2>/dev/null | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - goggles-network

networks:
  goggles-network:
    external: true
